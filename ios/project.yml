# XcodeGen spec — the Xcode project is generated from this file.
#
# Why generate instead of committing a .xcodeproj: project.pbxproj is a large,
# machine-managed plist that is miserable to edit on Windows and produces
# enormous conflicts. This file is plain text, reviewable, and diffable, so the
# whole iOS target can be maintained from the same checkout as the JavaScript.
#
#   brew install xcodegen
#   npm run build          # must run first: it writes GeneratedRoutes.swift and Resources/
#   cd ios && xcodegen generate
#   open InstagramFocus.xcodeproj
#
# CI does exactly this (see .github/workflows/ios-build.yml).

name: InstagramFocus

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    # Kept in step with package.json by scripts/build.mjs, which fails the build
    # if the two drift. The point is not tidiness: the on-device check for
    # "did the new build actually install?" is the app's version, and that is
    # only answerable if one number means one build.
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "1"

targets:
  InstagramFocus:
    type: application
    platform: iOS

    sources:
      # Everything in FocusApp, including the two generated files:
      #   GeneratedRoutes.swift  (written by npm run build)
      #   Resources/             (the shared core JS/CSS/JSON, copied by npm run build)
      - path: FocusApp
        excludes:
          - Info.plist
          - Resources
      # Declared separately, and explicitly as resources, so the shared engine
      # files land in the app bundle root where Bundle.main can find them.
      # They are not compiled — guard.js runs in the page, not in the app.
      - path: FocusApp/Resources
        buildPhase: resources

    info:
      path: FocusApp/Info.plist
      properties:
        CFBundleDisplayName: Focus
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        # Instagram's mobile layout is portrait-first; landscape is allowed
        # because the web view copes, not because it is pleasant.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.instagramfocus
        PRODUCT_NAME: InstagramFocus
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        # No entitlements, no capabilities. Deliberately: nothing here needs
        # App Review approval, which is what lets the app be sideloaded with a
        # free Apple ID instead of a $99/yr membership. Do not add Family
        # Controls or any other gated capability without revisiting that.
